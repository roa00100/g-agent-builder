name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      db:
        # docker-compose.yml 과 같은 메이저 버전.
        image: postgres:18
        env:
          POSTGRES_USER: agent_builder
          POSTGRES_PASSWORD: agent_builder_ci
          POSTGRES_DB: agent_builder
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agent_builder -d agent_builder"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
      redis:
        # docker-compose.yml 과 같은 메이저 버전. CI 는 일회용이라 AOF 를 켜지 않는다.
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      # 이 작업 안에서만 뜨는 일회용 DB·Redis 의 값이다.
      # 위 db 서비스의 env 와 같아야 한다.
      POSTGRES_USER: agent_builder
      POSTGRES_PASSWORD: agent_builder_ci
      POSTGRES_DB: agent_builder
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      # CI 의 Redis 는 비밀번호 없이 뜬다. REDIS_PASSWORD 를 두지 않는다.
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: "6379"
      REDIS_DB: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - run: python -m pip install -e "./agent-builder-core[dev]" -e "./agent-builder-infra[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - name: core tests (DB 없이)
        working-directory: agent-builder-core
        run: python -m pytest
      - name: migrations
        working-directory: agent-builder-infra
        run: alembic upgrade head
      - name: infra tests
        working-directory: agent-builder-infra
        run: python -m pytest

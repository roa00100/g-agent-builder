name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-builder-core
    services:
      db:
        # docker-compose.yml 과 같은 메이저 버전.
        image: postgres:18
        env:
          POSTGRES_USER: agent_builder
          POSTGRES_PASSWORD: agent_builder_ci
          POSTGRES_DB: agent_builder
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agent_builder -d agent_builder"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      # 이 작업 안에서만 뜨는 일회용 DB 의 값이다.
      DATABASE_URL: postgresql+psycopg://agent_builder:agent_builder_ci@127.0.0.1:5432/agent_builder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: agent-builder-core/.python-version
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: alembic upgrade head
      - run: python -m pytest

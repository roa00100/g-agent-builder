name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      db:
        # docker-compose.yml 과 같은 메이저 버전.
        image: postgres:18
        env:
          POSTGRES_USER: agent_builder
          POSTGRES_PASSWORD: agent_builder_ci
          POSTGRES_DB: agent_builder
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agent_builder -d agent_builder"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
      redis:
        # docker-compose.yml 과 같은 메이저 버전. CI 는 일회용이라 AOF 를 켜지 않는다.
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      # 이 작업 안에서만 뜨는 일회용 DB·Redis 의 값이다.
      # 위 db 서비스의 env 와 같아야 한다.
      POSTGRES_USER: agent_builder
      POSTGRES_PASSWORD: agent_builder_ci
      POSTGRES_DB: agent_builder
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      # CI 의 Redis 는 비밀번호 없이 뜬다. REDIS_PASSWORD 를 두지 않는다.
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: "6379"
      REDIS_DB: "0"
      # 오브젝트 스토리지는 아래 단계에서 docker run 으로 띄운다. 값은 그 단계와 같아야 한다.
      STORAGE_HOST: 127.0.0.1
      STORAGE_PORT: "8333"
      STORAGE_ACCESS_KEY: agent_builder
      STORAGE_SECRET_KEY: agent_builder_ci
      STORAGE_BUCKET: agent-builder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - run: python -m pip install -e "./agent-builder-core[dev]" -e "./agent-builder-infra[dev]" -e "./agent-builder-runtime[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - name: core tests (DB 없이)
        working-directory: agent-builder-core
        run: python -m pytest
      # GitHub 의 services 는 시작 명령(mini ...)을 넘길 수 없어 직접 띄운다.
      # 이미지·옵션은 docker-compose.yml 의 storage 와 같게 둔다.
      - name: object storage (SeaweedFS)
        run: |
          docker run -d --name storage -p 8333:8333 \
            -e AWS_ACCESS_KEY_ID="$STORAGE_ACCESS_KEY" \
            -e AWS_SECRET_ACCESS_KEY="$STORAGE_SECRET_KEY" \
            chrislusf/seaweedfs:4.55 \
            mini -dir=/data -bucket="$STORAGE_BUCKET" -s3.autoCreateBucket=false
          for i in $(seq 1 60); do
            curl -s -o /dev/null http://127.0.0.1:8333/ && break
            sleep 1
          done
      - name: migrations
        working-directory: agent-builder-infra
        run: alembic upgrade head
      - name: infra tests
        working-directory: agent-builder-infra
        run: python -m pytest
      - name: runtime tests
        working-directory: agent-builder-runtime
        run: python -m pytest

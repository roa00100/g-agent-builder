name: agent-builder

services:
  db:
    # 메이저 버전을 고정한다 — 메이저가 바뀌면 데이터 폴더가 호환되지 않는다.
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # 이 PC 에서만 붙는다. 바깥 네트워크에 열지 않는다.
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    volumes:
      # 18 부터 데이터가 /var/lib/postgresql/<버전>/ 아래에 놓인다.
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      # 기동 직후 `up --wait` 가 오래 기다리지 않도록 짧게 잡는다.
      interval: 2s
      timeout: 3s
      retries: 15

  app:
    # `docker compose up` 으로는 뜨지 않는다. `docker compose run --rm app` 으로 부른다.
    profiles: ["app"]
    build: .
    environment:
      # 컨테이너 안에서는 DB 가 127.0.0.1 이 아니라 서비스 이름 db 에 있다.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-builder-core"
version = "0.1.0"
description = "에이전트 빌더의 커널 — 공통 계약 구조. 특정 기술(DB·Redis·모델 공급자)을 모른다"
readme = "README.md"
# 개발 PC 에 설치된 버전이 3.13 이다.
requires-python = ">=3.13"
# 계약과 데이터 모양만 둔다. 기술 의존성(SQLAlchemy·redis·openai 등)은 넣지 않는다.
dependencies = [
    "pydantic>=2.10",
]

[project.optional-dependencies]
# ruff 는 저장소 전체(ruff.toml)에 쓰지만, core 는 늘 같이 설치되므로 여기에 둔다.
dev = ["pytest>=8", "ruff>=0.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 오타 난 마커·설정을 조용히 넘기지 않는다.
addopts = "--strict-markers --strict-config"

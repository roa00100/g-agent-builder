[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-builder-infra"
version = "0.1.0"
description = "에이전트 빌더의 기술 구성 — PostgreSQL·Redis·오브젝트 스토리지 접속과 공통 서비스, 테이블 정의"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # 같은 저장소의 core. 계약의 정의(예: InputKind)를 같이 쓴다.
    # 설치할 때 로컬 경로를 같이 넘긴다 (AGENTS.md 6절).
    "agent-builder-core",
    # 모델 공급자 호출. OpenRouter 는 OpenAI 호환 API 라서 주소만 바꿔 쓴다.
    # 하한은 OpenRouter 연결을 실제로 확인한 버전이다.
    "openai>=3.60",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    # 하한은 설치해 연결을 확인한 버전이다.
    "redis>=8.2",
    # 오브젝트 스토리지는 S3 API 로만 부른다 — SeaweedFS 를 바꿔도 이 코드는 그대로다.
    # 하한은 SeaweedFS 4.55 와 인증·읽기·쓰기를 실제로 확인한 버전이다.
    "boto3>=1.44",
    # 공급자 API 키를 DB·캐시에 암호문으로 둔다(Fernet). 하한은 설치해 확인한 버전이다.
    "cryptography>=50.0",
    # 관측 — 구조적 로그와 추적(OpenTelemetry). 하한은 설치해 확인한 버전이다.
    "structlog>=26.1",
    "opentelemetry-sdk>=1.45",
    "opentelemetry-exporter-otlp-proto-http>=1.45",
    # 자동 계측. 계측 패키지는 아직 베타(0.xxbN)로만 나온다.
    "opentelemetry-instrumentation-redis>=0.66b2",
    "opentelemetry-instrumentation-httpx>=0.66b2",
    "opentelemetry-instrumentation-botocore>=0.66b2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 오타 난 마커·설정을 조용히 넘기지 않는다.
addopts = "--strict-markers --strict-config"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-builder-infra"
version = "0.1.0"
description = "에이전트 빌더의 구현 — core 의 계약을 PostgreSQL·Redis·OpenRouter 로 채운다"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # 같은 저장소의 core. 설치할 때 로컬 경로를 같이 넘긴다 (README 「준비」).
    "agent-builder-core",
    # 모델 공급자 호출. OpenRouter 는 OpenAI 호환 API 라서 주소만 바꿔 쓴다.
    # 하한은 OpenRouter 연결을 실제로 확인한 버전이다.
    "openai>=3.60",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    # 하한은 설치해 연결을 확인한 버전이다.
    "redis>=8.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 오타 난 마커·설정을 조용히 넘기지 않는다.
addopts = "--strict-markers --strict-config"

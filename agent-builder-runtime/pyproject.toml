[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-builder-runtime"
version = "0.1.0"
description = "에이전트 빌더의 계약 구현·조립·실행 진입점 — 프로필로 CLI 또는 REST(FastAPI) 모드를 고른다"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # 같은 저장소의 core·infra. 설치할 때 로컬 경로를 같이 넘긴다 (AGENTS.md 6절).
    "agent-builder-core",
    "agent-builder-infra",
    # REST 모드. 웹 프레임워크는 runtime 의 rest/ 에서만 쓴다.
    # 하한은 설치해 실제로 서버를 띄워 확인한 버전이다.
    "fastapi>=0.165",
    "uvicorn>=0.54",
    # 프로필·REST 서버 주소 설정을 환경변수·.env 에서 읽는다.
    "pydantic-settings>=2.7",
]

[project.optional-dependencies]
# httpx: FastAPI 의 TestClient 가 쓴다.
dev = ["pytest>=8", "httpx>=0.29"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 오타 난 마커·설정을 조용히 넘기지 않는다.
addopts = "--strict-markers --strict-config"

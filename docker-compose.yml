name: agent-builder

services:
  db:
    # 메이저 버전을 고정한다 — 메이저가 바뀌면 데이터 폴더가 호환되지 않는다.
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # 이 PC 에서만 붙는다. 바깥 네트워크에 열지 않는다.
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    volumes:
      # 18 부터 데이터가 /var/lib/postgresql/<버전>/ 아래에 놓인다.
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      # 기동 직후 `up --wait` 가 오래 기다리지 않도록 짧게 잡는다.
      interval: 2s
      timeout: 3s
      retries: 15

  redis:
    # 메이저 버전을 고정한다.
    image: redis:8
    # 체크포인트를 담으므로 꺼졌다 켜져도 남아야 한다 — AOF 로 디스크에 쓴다.
    # appendfsync always: 쓸 때마다 디스크에 확정한다. 사용자 한 명이라 쓰기가 적어
    # 비용이 작다. everysec 이면 마지막 1초의 쓰기를 잃을 수 있다.
    # --requirepass: .env 의 REDIS_PASSWORD. 비어 있으면 빈 값이 넘어가 비밀번호 없이 돈다.
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - always
      - --requirepass
      - ${REDIS_PASSWORD:-}
    environment:
      # 아래 healthcheck 가 비밀번호를 알아야 한다.
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    ports:
      # 이 PC 에서만 붙는다. 바깥 네트워크에 열지 않는다.
      - "127.0.0.1:${REDIS_PORT}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      # 비밀번호가 있을 때만 인증한다 — 빈 비밀번호로 인증하면 Redis 가 오류를 낸다.
      # PONG 을 확인한다 — 인증에 실패해도 redis-cli 의 종료 코드는 0 이라 그것만으로는 모른다.
      # $$ 는 compose 가 치환하지 않고 컨테이너 셸에 $ 로 넘기게 하는 표기다.
      test:
        - CMD-SHELL
        - '[ -n "$$REDIS_PASSWORD" ] && export REDISCLI_AUTH="$$REDIS_PASSWORD"; redis-cli ping | grep -q PONG'
      interval: 2s
      timeout: 3s
      retries: 15

  storage:
    # 오브젝트 스토리지(S3 API). 버전까지 고정한다 — 4.x 안에서도 옵션이 자주 바뀐다.
    image: chrislusf/seaweedfs:4.55
    # mini: master·volume·filer·S3 를 한 프로세스로 띄운다. 사용자 한 명이라 이것으로 충분하다.
    # -bucket: 시작할 때 버킷을 만든다(이미 있으면 그대로).
    # -s3.autoCreateBucket=false: 없는 버킷에 쓰면 오류를 낸다 — 켜 두면 버킷 이름을
    #   잘못 적어도 새 버킷이 조용히 생긴다.
    command:
      - mini
      - -dir=/data
      - -bucket=${STORAGE_BUCKET}
      - -s3.autoCreateBucket=false
    environment:
      # 이 값이 있으면 S3 가 접근 키 인증을 요구한다.
      AWS_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${STORAGE_SECRET_KEY}
    ports:
      # 이 PC 에서만 붙는다. S3 포트만 연다 — 관리 화면 등 다른 포트는 열지 않는다.
      - "127.0.0.1:${STORAGE_PORT}:8333"
    volumes:
      - storage-data:/data
    healthcheck:
      # S3 포트가 응답하면 된다. 인증 전이라 403 이 오는 것이 정상이다.
      test: ["CMD-SHELL", "curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8333/ | grep -qE '^(2|3|4)'"]
      interval: 2s
      timeout: 3s
      retries: 30

  jaeger:
    # 로컬 추적 화면. `docker compose --profile observability up -d` 로 띄운다 — 기본으로는 뜨지 않는다.
    # 버전까지 고정한다. 2.x 는 OTLP 를 바로 받는다.
    # 받은 추적은 메모리에만 둔다 — 컨테이너를 다시 만들면 사라진다. 들여다보기용이라 그것으로 충분하다.
    profiles: ["observability"]
    image: jaegertracing/jaeger:2.23.0
    ports:
      # 이 PC 에서만 붙는다. 16686 은 화면, 4318 은 추적을 받는 OTLP HTTP.
      - "127.0.0.1:16686:16686"
      - "127.0.0.1:4318:4318"

  app:
    # `docker compose up` 으로는 뜨지 않는다. `docker compose run --rm app` 으로 부른다.
    profiles: ["app"]
    build:
      # core 와 infra 를 같이 넣어야 하므로 저장소 루트를 통째로 넘긴다.
      context: .
      dockerfile: agent-builder-infra/Dockerfile
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # 컨테이너 안에서는 DB 가 127.0.0.1 이 아니라 서비스 이름 db 에 있고,
      # 포트도 PC 에 연 포트가 아니라 컨테이너의 5432 다.
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      # Redis 도 같다 — 서비스 이름 redis, 컨테이너의 6379.
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DB: ${REDIS_DB}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      # 오브젝트 스토리지도 같다 — 서비스 이름 storage, 컨테이너의 8333.
      STORAGE_HOST: storage
      STORAGE_PORT: "8333"
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY}
      STORAGE_BUCKET: ${STORAGE_BUCKET}
      # 공급자 키를 풀 마스터 키. 키·주소·대기 시간 자체는 DB 의 공급자 프로필에 있다.
      SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-console}
      # 추적은 보내지 않는다 — .env 의 주소(127.0.0.1)는 컨테이너 안에서 맞지 않는다.
      # 컨테이너에서 보내려면 jaeger 를 띄우고 http://jaeger:4318 을 준다.
      OTEL_EXPORTER_OTLP_ENDPOINT: ""
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      storage:
        condition: service_healthy

volumes:
  db-data:
  redis-data:
  storage-data:
